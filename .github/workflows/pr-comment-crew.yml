name: crew-pr-comment

# Triggers on new PR comments and new PR review comments.
# Parses @crew mentions and dispatches the appropriate crew action.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:

# Minimal permissions required for the workflow.
permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  handle-mention:
    # Only run on pull request comments (issue_comment can fire on issues too).
    if: |
      (github.event_name == 'pull_request_review_comment') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Parse @crew mention
        id: parse
        run: |
          # Read comment body from the event JSON file (never interpolate untrusted
          # input via ${{ }} expressions — GitHub Actions injection vector).
          COMMENT_BODY=$(jq -r '.comment.body // .review.body // empty' "$GITHUB_EVENT_PATH")
          if [ -z "$COMMENT_BODY" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          result=$(printf '%s' "$COMMENT_BODY" | bun src/scripts/lib/gh-mention-parser.mts --stdin 2>/dev/null)
          exit_code=$?
          set -e
          if [ $exit_code -ne 0 ]; then
            echo "No @crew mention found — skipping."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          intent=$(printf '%s' "$result" | bun -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf-8'));process.stdout.write(d.intent)")
          body=$(printf '%s' "$result" | bun -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf-8'));process.stdout.write(d.body)")
          echo "intent=$intent" >> "$GITHUB_OUTPUT"
          # Use heredoc delimiter to prevent newline injection in $body
          {
            echo "body<<EOF_CREW_BODY"
            printf '%s\n' "$body"
            echo "EOF_CREW_BODY"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch crew action
        if: steps.parse.outputs.found == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INTENT: ${{ steps.parse.outputs.intent }}
          FIX_BODY: ${{ steps.parse.outputs.body }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REPO: ${{ github.repository }}
        run: |
          echo "Dispatching crew intent: $INTENT"
          echo "PR: $PR_NUMBER  Comment: $COMMENT_ID"
          # Dispatch is handed to the crew CLI / Claude Code runner here.
          # The fix body ($FIX_BODY) is text only — not a shell command.
          # It has already been sanitized (backticks and quotes removed) by
          # gh-mention-parser before reaching this step.
          echo "crew:$INTENT dispatched for PR #$PR_NUMBER"
